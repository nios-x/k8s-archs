apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-dep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backendlabel
  template:
    metadata:
      labels:
        app: backendlabel  
    spec:
      containers: 
      - name: backendpod
        image: backend:latest 
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000





