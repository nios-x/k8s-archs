# Plain nginx pods acting as a reverse proxy. This is a hand-made version of what
# the ingress-nginx controller did in k8s-3, without the controller or Ingress objects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gatewaylabel
  template:
    metadata:
      labels:
        app: gatewaylabel
    spec:
      containers:
      - name: gatewaypod
        image: nginx:1.28-alpine
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 80
        volumeMounts:
          # replaces the image's /etc/nginx/conf.d/default.conf with gateway-configmap.yml
          - name: gateway-config
            mountPath: /etc/nginx/conf.d
        # the load balancer only gets pods that answer /healthz
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          periodSeconds: 5
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-config
